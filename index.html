<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Ni uno menos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<meta name="description" content="Ni uno menos: juego educativo sobre prevención del acoso escolar.">
<style>
/* Concepto: un cuaderno de clase con cuadrícula. El subrayador amarillo marca lo importante;
   las notas amarillas son lo que el juego quiere que el alumnado se lleve. */
:root{
  --paper:#eef2f8; --grid:#d6deec; --ink:#17254d; --ink2:#46547a;
  --hl:#ffe45c; --pen:#2457d6; --card:#ffffff; --line:#c3cee2;
  --bad:#a8261b; --good:#17704a;
  --s1:#cde4f6; --s2:#c8cedb; --s3:#8794b6; --s4:#aebbd9; --s5:#9db6d6;
  --fh:'Caveat',cursive; --fb:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sz:1; --sat:1; --bri:1; --scr:0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1630; --grid:#18234a; --ink:#e8edfb; --ink2:#a6b2d4;
    --hl:#f4da4c; --pen:#8bb0ff; --card:#17213f; --line:#2a3860;
    --bad:#ff8f84; --good:#6fd6a3;
    --s1:#2a3d6b; --s2:#222d50; --s3:#4a5c92; --s4:#3a4a7e; --s5:#34528a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1630; --grid:#18234a; --ink:#e8edfb; --ink2:#a6b2d4;
  --hl:#f4da4c; --pen:#8bb0ff; --card:#17213f; --line:#2a3860;
  --bad:#ff8f84; --good:#6fd6a3;
  --s1:#2a3d6b; --s2:#222d50; --s3:#4a5c92; --s4:#3a4a7e; --s5:#34528a; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink); font-family:var(--fb); font-size:calc(17px * var(--sz)); line-height:1.5;
  padding-block:10px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
mark{background:var(--hl);color:#17254d;padding:0 .2em;border-radius:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.brand{font-family:var(--fh);font-size:2rem;font-weight:700;line-height:1}
.brand mark{padding:0 .25em}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.sm{font-size:.85em;border:2px solid var(--ink);background:var(--card);border-radius:8px;padding:4px 10px;cursor:pointer}
.sm:hover{background:var(--hl);color:#17254d}
.help{background:var(--hl);color:#17254d;font-weight:700}
.card{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.flat{border-color:var(--line)}
.kicker{font-size:.8em;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.big{font-family:var(--fh);font-size:3.2rem;font-weight:700;line-height:.95}
.lead{font-size:1.1em}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700;align-self:flex-start}
.btn:hover{background:var(--hl);color:#17254d}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.ghost:hover{background:var(--hl);color:#17254d}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.opts{display:flex;flex-direction:column;gap:2px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:12px 14px;margin:6px 0;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.opt:hover,.opt:focus-visible{background:var(--hl);color:#17254d}
.opt.sel{background:var(--hl);color:#17254d}
.opt .ok{color:var(--good);font-weight:700}
.stage{position:relative;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--s1);
  filter:saturate(var(--sat)) brightness(var(--bri));transition:filter .9s}
body.calm .stage{filter:none;transition:none}
.stage svg{display:block;width:100%;height:auto}
.stage img{display:block;width:100%;max-height:67vh;height:auto;object-fit:contain;background:#f7f2e8}
.stage.art-error img{display:none}
.stage:has(img:not([hidden])) > svg{display:none}
.stage:has(img){background:#f7f2e8;border-color:#17254d}
main .stage + .card{position:relative;margin-top:-12px;z-index:1;border-top:4px solid #4f8f95;box-shadow:0 -4px 22px #17254d18}
main .stage + .card .day{color:#4f8f95}
@media(min-width:850px){.wrap{max-width:850px}.stage img{max-height:68vh;object-fit:contain}}
.scrib{position:absolute;inset:0;pointer-events:none;opacity:var(--scr);transition:opacity .9s}
body.calm .scrib{display:none}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}.f4{fill:var(--s4)}.f5{fill:var(--s5)}
.ink{stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cp{fill:#ffe45c;stroke:#17254d;stroke-width:2}
.c1{fill:#e07a5f;stroke:#17254d;stroke-width:2}.c2{fill:#9b8bd6;stroke:#17254d;stroke-width:2}
.c3{fill:#5fb4a2;stroke:#17254d;stroke-width:2}.c4{fill:#f2a65a;stroke:#17254d;stroke-width:2}
.c5{fill:#7fa8e0;stroke:#17254d;stroke-width:2}.c6{fill:#c9b79c;stroke:#17254d;stroke-width:2}
.lbl{font:700 11px var(--fb);fill:var(--ink);text-anchor:middle}
.day{font-family:var(--fh);font-size:1.7rem;font-weight:700}
.scene p+p{margin-top:8px}
.note{background:var(--hl);color:#17254d;font-family:var(--fh);font-size:1.4em;line-height:1.2;padding:10px 14px;border-radius:2px;transform:rotate(-.5deg);box-shadow:2px 3px 0 rgba(0,0,0,.3)}
.diary{font-family:var(--fh);font-size:1.55em;line-height:1.9em;padding:2px 12px;
  background:repeating-linear-gradient(transparent,transparent calc(1.9em - 1px),var(--line) calc(1.9em - 1px),var(--line) 1.9em)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:.9em;background:var(--card)}
.chip b{font-weight:700}
.bag{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.bag .item{border:2px solid var(--ink);border-radius:10px;padding:10px 12px;background:var(--card)}
.bag .item.locked{border-style:dashed;border-color:var(--line);color:var(--ink2)}
.bag h3{font-size:1.05em;margin-bottom:2px}
.mini{position:relative;min-height:260px;display:flex;flex-direction:column;gap:10px}
.toast{position:absolute;max-width:76%;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:8px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);animation:pop .35s ease-out}
.toast small{display:block;color:var(--ink2);font-weight:700}
@keyframes pop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
body.calm .toast{animation:none}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.stage,.scrib{transition:none}}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.q{border:2px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.scale{display:flex;gap:8px;flex-wrap:wrap}
.scale button{width:44px;height:44px;border:2px solid var(--ink);border-radius:50%;background:var(--card);cursor:pointer;font-weight:700}
.scale button.sel,.scale button:hover{background:var(--hl);color:#17254d}
.scale-choice{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:48px;min-height:44px;border:2px solid var(--ink);border-radius:9px;background:var(--card);padding:4px 7px;cursor:pointer}
.scale-choice:has(input:checked){background:var(--hl);color:#17254d}
.scale-choice:focus-within{outline:3px solid var(--pen);outline-offset:2px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mode{border:2px solid var(--ink);border-radius:12px;background:var(--card);padding:14px;display:flex;flex-direction:column;gap:8px}
.mode h3{font-family:var(--fh);font-size:1.9rem}
.done{color:var(--good);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(8,12,30,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.ov .card{max-width:520px;width:100%;max-height:90vh;overflow:auto}
textarea{width:100%;font:inherit;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:8px;min-height:130px}
input[type=text]{font:inherit;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:8px 10px;width:100%;max-width:260px}
.small{font-size:.88em;color:var(--ink2)}
.warn{border:2px dashed var(--ink);border-radius:10px;padding:10px 12px}
table{border-collapse:collapse;width:100%}
td,th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
</style>
</head><body>

<div class="wrap" id="root"></div>

<script>
'use strict';
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S;
function freshState(){
  return {name:'Noa', sleep:3, mood:3, focus:3, bonds:2, flags:{}, queue:[], mode:0, curId:null,
          bag:{}, log:{1:[],2:[],3:[]}, done:{1:false,2:false,3:false}, W:null,
          pre:null, post:null, size:1, calm:false, answered:false, paused:null};
}
S = freshState();
function fmt(s){ return esc(s).replace(/\{n\}/g, esc(S.name)).replace(/==(.+?)==/g, '<mark>$1</mark>'); }
const clamp = v => Math.max(0, Math.min(4, v));
function applyFx(fx){ if(!fx) return; for (const k of ['sleep','mood','focus','bonds']) if (fx[k]) S[k] = clamp(S[k] + fx[k]); }
function setVisual(){
  const root = document.documentElement.style;
  if (S.mode === 1){
    root.setProperty('--sat', (0.42 + 0.145 * S.mood).toFixed(2));
    root.setProperty('--bri', (0.8 + 0.05 * S.sleep).toFixed(2));
    root.setProperty('--scr', ((4 - S.mood) * 0.16).toFixed(2));
  } else { root.setProperty('--sat', 1); root.setProperty('--bri', 1); root.setProperty('--scr', 0); }
}

/* ---------- escenarios ilustrados ---------- */
const FIG = {p:['cp','{n}'], i:['c1','Iker'], c:['c2','Cris'], m:['c3','Mar'], t:['c4','Elena'], o:['c5','Samuel'], h:['c6','Hugo']};
function fig(x, who, y){
  const f = FIG[who]; y = y || 190;
  return `<g><rect class="${f[0]}" x="${x-13}" y="${y-52}" width="26" height="52" rx="11"/><circle class="${f[0]}" cx="${x}" cy="${y-64}" r="13"/>
  <text class="lbl" x="${x}" y="${y-84}">${esc(f[1].replace('{n}', S.name))}</text></g>`;
}
const BACK = {
  patio: `<rect class="f1" width="640" height="130"/><path class="f5" d="M0 130 L130 70 L220 130Z"/><path class="f5" d="M180 130 L330 90 L420 130Z"/>
    <rect class="f2" y="130" width="640" height="90"/><rect class="f3" x="560" y="60" width="7" height="130"/><rect class="f4" x="535" y="52" width="46" height="30" rx="3"/>
    <rect class="f3" x="90" y="168" width="130" height="8" rx="3"/><rect class="f3" x="100" y="176" width="6" height="14"/><rect class="f3" x="204" y="176" width="6" height="14"/>`,
  aula: `<rect class="f1" width="640" height="220"/><rect class="f3" x="170" y="26" width="300" height="82" rx="5"/><path class="ink" d="M190 50h120M190 70h170"/>
    <rect class="f2" y="150" width="640" height="70"/><rect class="f4" x="40" y="128" width="130" height="10" rx="3"/><rect class="f4" x="255" y="128" width="130" height="10" rx="3"/><rect class="f4" x="470" y="128" width="130" height="10" rx="3"/>
    <rect class="f5" x="20" y="24" width="90" height="70" rx="4"/><path class="ink" d="M65 24v70M20 59h90"/>`,
  guagua: `<rect class="f3" width="640" height="220"/><rect class="f1" x="30" y="30" width="270" height="100" rx="8"/><rect class="f1" x="340" y="30" width="270" height="100" rx="8"/>
    <path class="f5" d="M30 130 L110 70 L170 130Z"/><path class="f5" d="M340 130 L430 60 L520 130Z"/><rect class="f2" x="30" y="112" width="270" height="18"/><rect class="f2" x="340" y="112" width="270" height="18"/>
    <rect class="f4" x="30" y="150" width="270" height="70" rx="8"/><rect class="f4" x="340" y="150" width="270" height="70" rx="8"/>`,
  casa: `<rect width="640" height="220" fill="#1c2a58"/><rect y="160" width="640" height="60" fill="#111a3a"/><rect x="40" y="120" width="210" height="60" rx="8" fill="#2f4180"/>
    <rect x="40" y="108" width="50" height="30" rx="8" fill="#3b4e96"/><circle cx="520" cy="110" r="70" fill="#ffe45c" opacity=".16"/><rect x="498" y="82" width="44" height="76" rx="7" fill="#ffe45c" opacity=".9"/>
    <rect x="504" y="90" width="32" height="56" rx="3" fill="#1c2a58"/><circle cx="560" cy="34" r="12" fill="#ffe45c" opacity=".75"/>`,
  pasillo: `<rect class="f1" width="640" height="220"/><rect class="f2" y="165" width="640" height="55"/>
    ${[40,120,200,280,360,440,520].map(x=>`<rect class="f4" x="${x}" y="30" width="70" height="135" rx="3"/><path class="ink" d="M${x+10} 60h50M${x+10} 66h50"/>`).join('')}`,
  tutoria: `<rect class="f1" width="640" height="220"/><rect class="f2" y="160" width="640" height="60"/><rect class="f5" x="440" y="26" width="150" height="90" rx="5"/><path class="ink" d="M515 26v90M440 71h150"/>
    <rect class="f3" x="150" y="128" width="130" height="10" rx="3"/><rect class="f3" x="160" y="138" width="7" height="30"/><rect class="f3" x="262" y="138" width="7" height="30"/>`,
  circulo: `<rect class="f1" width="640" height="220"/><ellipse class="f2" cx="320" cy="165" rx="270" ry="45"/>
    ${[110,215,320,425,530].map(x=>`<rect class="f3" x="${x-20}" y="${x===320?172:150}" width="40" height="8" rx="3"/>`).join('')}`
};
const SCRIB = `<svg viewBox="0 0 640 220" preserveAspectRatio="none" aria-hidden="true"><path d="M10 20 C60 5 90 40 140 12 S230 35 280 10" fill="none" stroke="#17254d" stroke-width="3" opacity=".55"/>
  <path d="M360 205 C410 185 450 215 500 195 S590 210 632 190" fill="none" stroke="#17254d" stroke-width="3" opacity=".55"/><path d="M590 20 L630 60 M600 60 L630 28" stroke="#17254d" stroke-width="3" opacity=".5"/></svg>`;
// Escenas canónicas de la biblia visual. Los demás estados conservan el SVG de v1.1.
const ART = {
  m1_intro:'s1_00',m1_lun_patio:'s1_01',m1_lun_aula:'s1_02',m1_lun_noche:'s1_03',
  sum_lun:'s1_04',m1_mar_guagua:'s1_05',m1_mar_mates:'s2_00',m1_mar_recreo:'s2_01',
  m1_mar_noche:'s2_02',sum_mar:'s2_03',m1_mie_manana:'s2_04',m1_mie_ia:'s2_05',
  sum_mie:'s3_00',m1_jue_decide:'s3_01',m1_jue_elena:'s3_02',m1_jue_samuel:'s3_02',
  m1_jue_900:'s3_03',m1_jue_espera:'s3_03',m1_proto:'s3_04',sum_jue:'s3_05',
  m1_vie:'s3_06',m1_end:'s3_07',
  m2_intro:'m2_00',m2_lun:'m2_01',m2_mar:'m2_02',m2_mie:'m2_03',
  m2_jue:'m2_04',m2_vie:'m2_05',m2_end:'m2_07',
  m3_intro:'m3_00',m3_normas:'m3_01',m3_escucha:'m3_02',
  m3_iker:'m3_04',m3_compromisos:'m3_05',m3_end:'m3_05'
};
function stage(place, who){
  const art = ART[S.curId];
  const xs = {1:[320],2:[260,380],3:[200,320,440],4:[150,260,380,490]}[who.length] || [320];
  const fallback = `<svg viewBox="0 0 640 220" aria-hidden="true">${BACK[place] || ''}${who.map((w,i)=>fig(xs[i], w)).join('')}</svg>`;
  if (art) return `<div class="stage" role="img" aria-label="Viñeta de ${esc(SC[S.curId]?.day || place)}"><img src="assets/${art}.jpg" alt="" loading="eager" decoding="async" onerror="this.hidden=true">${fallback}</div>`;
  return `<div class="stage" role="img" aria-label="Ilustración de la escena: ${esc(place)}">${fallback}<div class="scrib">${S.mode===1?SCRIB:''}</div></div>`;
}

/* ---------- mochila de recursos ---------- */
const BAG = {
  tutora:  ['Tu tutor o tutora', 'Cualquier miembro de la comunidad educativa que conozca un indicio de acoso debe comunicarlo al tutor o al equipo directivo, que valora las medidas de urgencia.'],
  orienta: ['Orientación del centro', 'Acompaña al alumnado y a las familias y participa en la valoración del caso y en el plan de actuación.'],
  cbp:     ['Coordinador o coordinadora de bienestar y protección', 'Figura que la LOPIVI exige en los centros con menores. Si tu centro la tiene, puede ayudarte; si no sabes quién es, pregunta en dirección.'],
  familia: ['Tu familia', 'Puede hablar con el centro. Contarlo no te hace «chivato»: ellos no tienen que arreglarlo solos, pero sí pueden pedir que el centro actúe.'],
  l900:    ['Teléfono 900 018 018', 'Gratuito, confidencial y anónimo, 24 horas. Lo atienden psicólogos con trabajadores sociales y abogados. Pueden llamar alumnos, familias, docentes y cualquier persona que sepa de un caso.'],
  pruebas: ['Guardar pruebas', 'Haz una captura con fecha, no la reenvíes y enséñasela a una persona adulta. Sirve para que el centro valore lo que pasa.'],
  amigo:   ['Una amistad de confianza', 'Hablar con alguien de tu edad alivia. Ayuda más si esa persona también te acompaña a contárselo a un adulto.']
};
function unlock(k){ if (k && !S.bag[k]) S.bag[k] = true; }

/* ---------- guion ---------- */
const NOTE_BYSTANDERS = '';
const SC = {};
function def(id, o){ o.id = id; SC[id] = o; }

/* MODO 1: SU SEMANA */
def('m1_intro', {place:'aula', who:['p'], day:'Antes de empezar',
  paras:S=>['Eres =={n}==. Es octubre y llevas un mes en 1.º de ESO. Vienes de otro colegio y todavía te estás haciendo al instituto.',
            'Esta es tu semana, de lunes a viernes. No hay una única forma de vivirla: tus decisiones cambian lo que pasa. Nada de lo que elijas es «culpa tuya».'],
  choices:S=>[{t:'Empezar el lunes'}]});
def('m1_lun_patio', {place:'patio', who:['p','i','c'], day:'Lunes',
  paras:S=>['Recreo. Te acercas al grupo de tu clase junto a la cancha. Llevas una mochila enorme porque cargas los libros de todo el día.',
            'Iker te mira y dice para que lo oigan todos: «Ya viene ==Tortuga==, con la casa a cuestas». Cris se ríe. Dos o tres más se ríen sin ganas.'],
  choices:S=>[
    {t:'Te ríes también, como si no te importara.', fx:{mood:-1}, flag:'rio', note:'Reír es una forma de protegerte, pero el mote duele igual. Y a quien mira le parece que estás de acuerdo.'},
    {t:'Dices en voz alta: «No me hace gracia».', flag:'limite', note:'Poner un límite es válido. Que no funcione al momento no significa que lo hicieras mal.'},
    {t:'Te vas hacia la fuente y esperas a que suene el timbre.', fx:{mood:-1}, flag:'evita', note:'Alejarte te cuida un rato, pero a solas todo pesa más.'}]});
def('m1_lun_aula', {place:'aula', who:['p','m','i'], day:'Lunes',
  paras:S=>['Lengua. La profesora, Elena, pide grupos de cuatro para un trabajo. Todos se juntan rápido. Tú te quedas de pie con tu cuaderno.',

/* ---------- motor de escenas ---------- */
function startMode(m){
  S.paused = null;
  S.mode = m; S.done[m] = false; S._started = true; S.log[m] = []; S.flags = {};
  if (m === 1){ S.sleep=3; S.mood=3; S.focus=3; S.bonds=2;
    S.queue = ['m1_intro','m1_lun_patio','m1_lun_aula','m1_lun_noche','sum_lun','m1_mar_guagua','m1_mar_mates','m1_mar_recreo','m1_mar_noche','sum_mar','m1_mie_manana','m1_mie_ia','sum_mie','m1_jue_decide','sum_jue','m1_vie','m1_end'];
  } else if (m === 2){
    S.W = null; S._w = {};
    S.queue = ['m2_intro','m2_lun','m2_mar','m2_mie','m2_jue','m2_vie','m2_end'];
  } else {
    S.queue = ['m3_intro','m3_normas','m3_escucha','m3_iker','m3_compromisos','m3_end'];
  }
  next();
}
function next(){ const id = S.queue.shift(); if (!id){ viewMenu(); return; } S.curId = id; renderScene(SC[id]); }

function renderScene(sc){
  if (sc.type === 'sum') return renderSum(sc);
  if (sc.type === 'mini') return renderMini(sc);
  if (sc.type === 'info') return renderInfo(sc);
  if (sc.type === 'end') return renderEnd(sc);
  if (sc.type === 'multi') return renderMulti(sc);
  const paras = sc.paras(S);
  const ch = sc.choices(S);
  S.answered = false; S._ch = ch;
  show(`${stage(sc.place, sc.who)}<div class="card scene"><div class="day">${esc(sc.day)}</div><div aria-live="polite">${paras.map(p=>`<p>${fmt(p)}</p>`).join('')}</div>
  <div class="opts" id="opts">${ch.map((c,i)=>`<button class="opt" data-a="choose" data-i="${i}">${fmt(c.t)}</button>`).join('')}</div></div>`);
}
function choose(i){
  if (S.answered) return; S.answered = true;
  const sc = SC[S.curId]; const c = S._ch[i];
  applyFx(c.fx);
  if (c.flag) S.flags[c.flag] = true;
  if (c.flag2) S.flags[c.flag2] = true;
  if (c.flags) for (const flag of c.flags) S.flags[flag] = true;
  if (c.bag) unlock(c.bag);
  if (S.mode === 2 && S._w){
    if (c.flag) S._w[c.flag] = true;
    if (c.flags) for (const flag of c.flags) S._w[flag] = true;
  }
  S.log[S.mode].push(`${sc.day}: ${c.t.replace(/\{n\}/g, S.name)}`);
  if (c.goto) S.queue.unshift(...c.goto);
  setVisual();
  const opts = $('#opts');
  opts.innerHTML = [...document.querySelectorAll('#opts .opt')].map((b,k)=>`<button class="opt ${k===i?'sel':''}" disabled style="cursor:default">${b.innerHTML}</button>`).join('');
  let extra = '';
  if (S.mode === 2 && c.fxN) extra = `<p class="small">Cómo lo vive ${esc(S.name)} (lo verás al volver a jugar «Su semana»): ${esc(c.fxN)}</p>`;
  const note = c.note ? `<div class="note">${fmt(c.note)}</div>` : '';
  const holder = document.createElement('div');
  holder.innerHTML = `${note}${extra}<button class="btn" data-a="next" style="margin-top:6px">Continuar</button>`;
  opts.parentNode.appendChild(holder);
  holder.querySelector('button').focus({preventScroll:false});

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a;
  switch (a){
    case 'start': { const v = ($('#nm') && $('#nm').value.trim()) || 'Noa'; S.name = v.slice(0,14); viewMenu(); break; }
    case 'intro': viewIntro(); break;
    case 'menu': pauseToMenu(); break;
    case 'resume': resumeMode(); break;
    case 'discard': S.paused = null; viewMenu(); break;
    case 'help': viewHelp(); break;
    case 'closehelp': closeHelp(); break;
    case 'guide': viewGuide(); break;
    case 'bag': viewBag(); break;
    case 'summary': viewSummary(); break;
    case 'copy': { const ta = $('#sumtxt'); const done = ok => { $('#cpmsg').textContent = ok ? 'Copiado.' : 'Selecciona el texto y cópialo con el teclado.'; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(()=>done(true), ()=>{ ta.select(); done(false); }); else { ta.select(); done(false); } break; }
    case 'test': viewPre(t.dataset.k); break;
    case 'sendtest': submitTest(t.dataset.k); break;
    case 'mode': startMode(+t.dataset.m); break;
    case 'choose': choose(+t.dataset.i); break;
    case 'next': next(); break;
    case 'dis': { t.remove(); S._mg.dismissed++; break; }
    case 'mans': miniAnswer(t.dataset.v); break;
    case 'pick': togglePick(+t.dataset.i); break;
    case 'confirm': confirmPick(); break;
    case 'size+': S.size = Math.min(1.4, S.size + 0.1); document.documentElement.style.setProperty('--sz', S.size); break;
    case 'size-': S.size = Math.max(0.9, S.size - 0.1); document.documentElement.style.setProperty('--sz', S.size); break;
    case 'calm': S.calm = !S.calm; document.body.classList.toggle('calm', S.calm); t.textContent = S.calm ? 'Efectos: apagados' : 'Efectos: activos'; t.setAttribute('aria-pressed', S.calm); break;
  }
});
document.addEventListener('keydown', e => {
  const dialog = $('#ov');
  if (!dialog) return;
  if (e.key === 'Escape'){ e.preventDefault(); closeHelp(); return; }
  if (e.key === 'Tab'){
    const items = [...dialog.querySelectorAll('button:not([disabled]),a[href],input:not([disabled])')];
    if (!items.length) return;
    const first=items[0], last=items[items.length-1];
    if (e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});
viewIntro();
</script>
